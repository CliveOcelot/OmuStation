- type: entity
  parent: [ClothingHeadHardsuitBase, ClothingHeadHardsuitWithLightBase, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitTrauma
  name: armed trauma unit T-23 tacsuit helmet
  description: The standard combat suit of the Armed Trauma Unit, outfitted with a medical hud. # Omu, remove "a limited-range radar hud as well as"
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/trauma.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/trauma.rsi
  - type: PointLight
    color: "#4e88a6"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
#  - type: RadarConsole # Omu, this doesn't work here
#    followEntity: true
#  - type: ActivatableUI
#    key: enum.RadarConsoleUiKey.Key
#    singleUser: true
#  - type: UserInterface
#    interfaces:
#      enum.RadarConsoleUiKey.Key:
#        type: RadarConsoleBoundUserInterface
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: HideLayerClothing
    slots:
    - Hair
    - Special
    - FacialHair
    - Snout
    - Head
    - HeadTop
    - HeadSide

- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons]
  id: ClothingHeadHelmetHardsuitTraumaLeader
  name: armed trauma unit T-53 tacsuit helmet
  description: The commander's tacsuit in the Armed Trauma Unit, outfitted with a medical hud as well as thermals and night vision. # Omu - remove "and long-range radar"
  components:
  - type: Sprite
    sprite: _Mono/Clothing/Head/Hardsuits/trauma_leader.rsi
  - type: Clothing
    sprite: _Mono/Clothing/Head/Hardsuits/trauma_leader.rsi
  - type: PointLight
    color: "#4e88a6"
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: NightVision
    flashDurationMultiplier: 2
    isEquipment: true
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 3
    isEquipment: true
    toggleAction: PulseThermalVision
